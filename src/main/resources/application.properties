# ===================================================================
# SMART AGRICULTURE MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# ===================================================================

server.port=8080
spring.application.name=smart-agri-system

# -------------------------------------------------------------------
# 1. MYSQL DATABASE CONFIGURATION (Active)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_agri_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sumeshroot01
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seed Data Initialization (Runs data.sql automatically)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

